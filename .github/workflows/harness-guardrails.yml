name: Harness Guardrails

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docs safety checks
        run: bash scripts/check-docs-safety.sh

      - name: Control invariant checks
        run: bash scripts/check-control-invariants.sh

      - name: Anti-downgrade checks
        run: bash scripts/check-security-downgrade.sh
